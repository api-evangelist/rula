aid: rula
name: Rula
description: Rula is a telehealth mental health platform that connects patients with licensed therapists
  and psychiatric providers who accept their insurance. Operating as an in-network behavioral health
  marketplace across all 50 states, Rula matches individuals with more than 23,000 licensed clinicians
  for individual, couples, family, child, and teen therapy as well as psychiatric medication management,
  covering 90+ conditions including anxiety, depression, ADHD, PTSD, OCD, and addiction. Rula is
  in-network with 120+ insurance plans nationwide (Aetna, Cigna, Optum, UnitedHealthcare, Blue Cross,
  Kaiser), with patients paying an average of about $15 per session with insurance. Rula publishes no
  public developer API, developer portal, or partner API surface as of this profile; care is delivered
  through its patient and provider web applications.
